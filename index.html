<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="我们的小岛">
<meta name="theme-color" content="#5cc8ea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>我们的小岛</title>
<link rel="stylesheet" href="style.css?v=37">
</head><body>
<header id="top"><div id="title">🏝️ 我们的小岛</div><div id="right"><div id="net"></div><div id="inv"></div><button id="gear">⚙️</button></div></header>
<div id="info"></div>
<div id="menu" class="hidden"><div class="card"><b>选择我的小狗</b><div class="pups"><button data-char="yellow"><canvas width="96" height="96"></canvas>鸡毛（黄狗）</button><button data-char="white"><canvas width="96" height="96"></canvas>小白（白狗）</button></div><div id="who"></div><button id="logout">退出登录</button><button id="menuClose">好的</button></div></div>
<main><canvas id="map"></canvas><div id="toast"></div>
<div id="joy"><div id="knob"></div></div>
<div id="pv" class="hidden"><button id="pvNo">✖</button><button id="pvOk">✔</button></div><button id="feed" class="hidden">喂猪 🥕</button><button id="drive" class="hidden">赶猪</button><button id="bark" class="hidden">汪！</button><div id="alert" class="hidden"></div><button id="feedBaby" class="hidden">投喂胖宝</button><button id="grab" class="hidden">抓住胖宝</button></main>
<div id="signDlg" class="hidden"><div class="card"><b>🏠 编辑门牌</b><input id="signIn" maxlength="12" placeholder="我们的家" enterkeyhint="done" autocomplete="off"><div class="row"><button id="signCancel">取消</button><button id="signOk">好的</button></div></div></div>
<div id="house" class="hidden"><div class="hhead"><button id="houseClose">‹ 出门</button><h2 id="houseTitle">🏠 我们的家</h2><span></span></div>
<div class="hbody"><div class="emptyRoom">🛋️<p>这里还空空的，以后可以装修~</p></div><div class="food"><h3>💕 见面了一起吃</h3><ul id="wishList"></ul>
<button id="addBtn">＋ 添加想吃的</button>
<form id="wishForm" class="hidden" autocomplete="off"><b id="formTitle">想一起吃…</b><input name="name" maxlength="40" placeholder="吃什么（必填）" enterkeyhint="next"><input name="note" maxlength="200" placeholder="备注：哪家店、什么口味（可选）"><input name="url" type="url" inputmode="url" placeholder="链接（可选，比如小红书/抖音）" autocapitalize="off"><div class="row"><button type="button" id="formCancel">取消</button><button type="submit">保存</button></div></form>
<h3 id="doneHead" class="hidden">✅ 吃过啦</h3><ul id="doneList"></ul></div></div></div>
<div id="foodPick" class="hidden"><div class="card"><b>🍽️ 投喂胖宝</b><p id="foodFull"></p><div id="foodList"></div><button id="foodClose">好的</button></div></div>
<div id="seeds" class="hidden"></div>
<nav id="toolbar"></nav>
<div id="gate" class="hidden"><div class="card" id="gateBody"></div></div>
<script src="js/store.js?v=37"></script>
<script src="js/vendor/supabase.js?v=37"></script>
<script src="js/sync.js?v=37"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r&&r.update()).catch(()=>{});let d=0;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!d){d=1;location.reload()}})}</script>
</body></html>
